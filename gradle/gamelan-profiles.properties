# Gamelan Gradle profile definitions.
#
# Format:
#   profile.<name>.description=<human-readable description>
#   profile.<name>.projects=:project-a,:project-b
#
# Add a new profile here to get generated tasks such as:
#   gamelan<MyProfile>Compile, gamelan<MyProfile>Test, gamelan<MyProfile>Build

profile.core.description=Minimal engine SPI, plugin SPI, engine core, SDK core/local modules
profile.core.projects=:gamelan-engine-spi,:gamelan-plugin-spi,:gamelan-engine-core,:gamelan-sdk-client-core,:gamelan-sdk-executor-core,:gamelan-sdk-client-local

profile.agentic-local.description=Local-first agent orchestration profile: core engine, DAG extension, local runtime, local client/executor SDKs
profile.agentic-local.projects=:gamelan-engine-spi,:gamelan-plugin-spi,:gamelan-engine-core,:gamelan-runtime-core,:gamelan-runtime-standalone,:gamelan-dag,:gamelan-sdk-client-core,:gamelan-sdk-client-local,:gamelan-sdk-executor-core,:gamelan-sdk-executor-local
profile.agentic-local.runtime-contract=offline-agent

profile.business-automation.description=Business automation and EIP server profile: core engine, DAG extension, server app, executor registry, protocols
profile.business-automation.projects=:gamelan-engine-spi,:gamelan-plugin-spi,:gamelan-engine-core,:gamelan-dag,:gamelan-engine,:gamelan-executor-registry,:gamelan-protocol-grpc,:gamelan-protocol-kafka
profile.business-automation.runtime-contract=production

profile.server.description=Quarkus engine app and executor registry
profile.server.projects=:gamelan-executor-registry,:gamelan-engine
profile.server.runtime-contract=production

profile.executor.description=Executor registry, executor runtimes, and executor SDK transports
profile.executor.projects=:gamelan-executor-registry,:gamelan-executor-runtime-core,:gamelan-executor-runtime,:gamelan-sdk-executor-local,:gamelan-sdk-executor-remote

profile.client.description=Local and remote client SDK modules
profile.client.projects=:gamelan-sdk-client-local,:gamelan-sdk-client-remote

profile.protocols.description=gRPC and Kafka protocol modules
profile.protocols.projects=:gamelan-protocol-grpc,:gamelan-protocol-kafka

profile.runtimes.description=Standalone and distributed runtime modules
profile.runtimes.projects=:gamelan-runtime-core,:gamelan-runtime-standalone,:gamelan-runtime-distributed
profile.runtimes.runtime-contract=distributed

profile.plugins.description=Built-in plugin modules
profile.plugins.projects=:gamelan-plugin-default,:gamelan-plugin-consul

profile.extensions.description=Optional extension modules
profile.extensions.projects=:gamelan-dag

profile.examples.description=Example clients, executors, and plugin demos
profile.examples.projects=:gamelan-test-client,:gamelan-test-executor,:gamelan-test-standalone,:gamelan-plugin-example,:plugin-system-test
