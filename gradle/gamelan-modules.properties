# Gamelan Gradle module definitions.
#
# Format:
#   project.<gradle-project-name>=<relative-project-directory>
#
# The settings script includes each entry as :<gradle-project-name>.
# Keep project names aligned with Gradle profile roots in gamelan-profiles.properties.

# Framework Layer
project.gamelan-framework-parent=framework
project.gamelan-engine-spi=framework/gamelan-engine-spi
project.gamelan-plugin-spi=framework/gamelan-plugin-spi
project.gamelan-engine-core=framework/gamelan-engine-core
project.gamelan-sdk-client-core=framework/gamelan-sdk-client-core
project.gamelan-sdk-executor-core=framework/gamelan-sdk-executor-core
project.gamelan-dag=framework/gamelan-dag

# Runtime Layer
project.gamelan-runtime-parent=runtime
project.gamelan-engine=runtime/gamelan-engine
project.gamelan-executor-registry=runtime/gamelan-executor-registry
project.gamelan-runtime-core=runtime/gamelan-runtime-core
project.gamelan-protocol-grpc=runtime/protocol/gamelan-protocol-grpc
project.gamelan-protocol-kafka=runtime/protocol/gamelan-protocol-kafka
project.gamelan-runtime-standalone=runtime/gamelan-runtime-standalone
project.gamelan-runtime-distributed=runtime/gamelan-runtime-distributed
project.gamelan-plugins=runtime/plugins
project.gamelan-plugin-default=runtime/plugins/gamelan-plugin-default
project.gamelan-plugin-consul=runtime/plugins/gamelan-plugin-consul

# SDK Layer
project.gamelan-sdk-parent=sdk
project.gamelan-sdk-client-local=sdk/gamelan-sdk-client-local
project.gamelan-sdk-client-remote=sdk/gamelan-sdk-client-remote
project.gamelan-sdk-executor-local=sdk/gamelan-sdk-executor-local
project.gamelan-sdk-executor-remote=sdk/gamelan-sdk-executor-remote

# Examples & Tests
project.gamelan-test-client=examples/gamelan-test-client
project.gamelan-test-executor=examples/gamelan-test-executor
project.gamelan-test-standalone=examples/gamelan-test-standalone
project.gamelan-plugin-example=examples/gamelan-plugin-example
project.plugin-system-test=examples/plugin-system-test
