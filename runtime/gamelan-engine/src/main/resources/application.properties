# Default configuration for gamelan-engine build/test
# This ensures CDI validation passes during the build
gamelan.runtime.capabilities.contract=local
gamelan.runtime.capabilities.cache-ttl=0s
gamelan.runtime.capabilities.startup-validation.mode=warn
gamelan.runtime.capabilities.startup-validation.accept-degraded=true
gamelan.runtime.capabilities.startup-validation.issue-detail-limit=20
gamelan.runtime.capabilities.readiness.accept-degraded=true
gamelan.runtime.capabilities.readiness.issue-detail-limit=20
gamelan.registry.persistence.type=memory
gamelan.scheduler.mode=local
gamelan.event.publisher.family=local
gamelan.workflow.wakeup.outbox.store=auto
gamelan.orchestrator.no-executor-policy=fail
gamelan.orchestrator.max-ready-nodes-per-cycle=256
gamelan.orchestrator.max-concurrent-dispatches=64
gamelan.workflow.compilation.cache.enabled=true
gamelan.workflow.compilation.cache.max-size=1024
gamelan.workflow.planning.validate-definition=true
gamelan.recovery.enabled=true
gamelan.recovery.scan-interval=30s
gamelan.recovery.page-size=100
gamelan.recovery.max-concurrent-runs=4
gamelan.recovery.max-scan-runs=10000
gamelan.recovery.timeout-grace=30s
gamelan.recovery.replay-consistency-mode=best-effort
gamelan.recovery.distributed-lease.enabled=false
gamelan.recovery.distributed-lease.name=workflow-recovery
gamelan.recovery.distributed-lease.owner-id=${GAMELAN_RECOVERY_LEASE_OWNER_ID:}
gamelan.recovery.distributed-lease.ttl=2m
gamelan.recovery.distributed-lease.renew-interval=0s
gamelan.retry.scan-interval=5s
gamelan.retry.redis.batch-size=50
gamelan.retry.redis.claim-ttl=30s
gamelan.workflow.wakeup.retry-interval=5s
gamelan.workflow.wakeup.retry-backoff=5s
gamelan.workflow.wakeup.max-pending=10000
gamelan.workflow.wakeup.max-delivery-attempts=100
gamelan.workflow.wakeup.drain-batch-size=256
gamelan.workflow.wakeup.delivery-parallelism=32
gamelan.workflow.persistence.file.root=${GAMELAN_WORKFLOW_STORE_DIR:.gamelan/workflow}
gamelan.workflow.persistence.file.history-log-compaction-bytes=${GAMELAN_WORKFLOW_HISTORY_COMPACTION_BYTES:1048576}
gamelan.agent.context.store=file
gamelan.agent.context.local.root=${GAMELAN_AGENT_CONTEXT_DIR:.gamelan/agent-context}
gamelan.agent.context.max-document-bytes=${GAMELAN_AGENT_CONTEXT_MAX_DOCUMENT_BYTES:8388608}
gamelan.agent.context.max-metadata-bytes=${GAMELAN_AGENT_CONTEXT_MAX_METADATA_BYTES:262144}
gamelan.agent.context.max-list-results=${GAMELAN_AGENT_CONTEXT_MAX_LIST_RESULTS:1000}
%prod.gamelan.runtime.capabilities.contract=production
%prod.gamelan.runtime.capabilities.cache-ttl=2s
%prod.gamelan.runtime.capabilities.startup-validation.mode=fail
%prod.gamelan.runtime.capabilities.startup-validation.accept-degraded=false
%prod.gamelan.runtime.capabilities.startup-validation.issue-detail-limit=10
%prod.gamelan.runtime.capabilities.readiness.accept-degraded=false
%prod.gamelan.runtime.capabilities.readiness.issue-detail-limit=10
%prod.gamelan.registry.persistence.type=database
%prod.gamelan.workflow.persistence.store=postgres
%prod.gamelan.agent.context.store=postgres
%prod.gamelan.scheduler.mode=redis
%prod.gamelan.event.publisher.family=kafka
%prod.gamelan.workflow.wakeup.outbox.store=postgres
%prod.quarkus.arc.selected-alternatives=tech.kayys.gamelan.kafka.KafkaEventPublisher

quarkus.index-dependency.gamelan-engine-core.group-id=tech.kayys.gamelan
quarkus.index-dependency.gamelan-engine-core.artifact-id=gamelan-engine-core
quarkus.index-dependency.gamelan-engine-spi.group-id=tech.kayys.gamelan
quarkus.index-dependency.gamelan-engine-spi.artifact-id=gamelan-engine-spi
quarkus.index-dependency.gamelan-registry.group-id=tech.kayys.gamelan
quarkus.index-dependency.gamelan-registry.artifact-id=gamelan-registry
