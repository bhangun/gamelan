

quarkus.http.ssl.enabled=false

# Quarkus Test Configuration
quarkus.datasource.devservices.enabled=false
quarkus.redis.devservices.enabled=false
quarkus.hibernate-reactive.devservices.enabled=false

# Dummy configuration for local testing without real DB/Redis
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=quarkus
quarkus.datasource.password=quarkus
quarkus.datasource.reactive.url=postgresql://localhost:5432/quarkus
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/quarkus
# Avoid JSON mapping conflict in tests
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-reactive.schema-management.strategy=none

# JVM tests must not inherit native-image build settings from production/platform config.
quarkus.native.enabled=false
quarkus.native.container-build=false
quarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21

quarkus.redis.hosts=redis://localhost:6379

quarkus.kafka.devservices.enabled=false
# If you need to enable Kafka devservices, use the correct image:
# quarkus.kafka.devservices.image-name=docker.redpanda.com/redpandadata/redpanda:v24.1.2
gamelan.recovery.enabled=false
gamelan.recovery.scan-interval=30s
