# Gamelan Standalone Runtime Configuration
# Default configuration for the standalone workflow engine

# HTTP Server Configuration
quarkus.http.port=3100
quarkus.http.host=0.0.0.0

# Dev Services
quarkus.devservices.enabled=false

# gRPC Server Configuration
quarkus.grpc.server.enable=false
quarkus.grpc.server.port=3101
quarkus.grpc.server.host=0.0.0.0

# Logging Configuration
quarkus.log.level=INFO
quarkus.log.console.format=%d{HH:mm:ss,SSS} [%level] %logger: %msg%n
quarkus.log.category."tech.kayys.gamelan".level=DEBUG

# Database Configuration (H2 for standalone)
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.enabled=true
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.min-size=1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.flyway.migrate-at-start=false
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.hibernate-reactive.enabled=false

# Redis Configuration (embedded for standalone)
quarkus.redis.hosts=localhost:6379

# Workflow Engine Configuration
gamelan.engine.name=standalone-engine
gamelan.engine.id=${gamelan.engine.name}-${random.uuid}
# Deployment mode: STANDALONE | SERVER | ENTERPRISE
gamelan.deployment-mode=STANDALONE
gamelan.multi-tenancy.enabled=false
gamelan.tenant.default-id=default-tenant
gamelan.runtime.capabilities.contract=offline-agent
gamelan.runtime.capabilities.cache-ttl=0s
gamelan.runtime.capabilities.startup-validation.mode=fail
gamelan.runtime.capabilities.startup-validation.accept-degraded=true
gamelan.runtime.capabilities.startup-validation.issue-detail-limit=50
gamelan.runtime.capabilities.readiness.accept-degraded=true
gamelan.runtime.capabilities.readiness.issue-detail-limit=50
gamelan.workflow.persistence.store=file
gamelan.event.publisher.family=local
gamelan.workflow.wakeup.outbox.store=file
gamelan.workflow.persistence.file.root=${GAMELAN_WORKFLOW_STORE_DIR:.gamelan/workflow}
gamelan.workflow.persistence.file.history-log-compaction-bytes=${GAMELAN_WORKFLOW_HISTORY_COMPACTION_BYTES:1048576}
gamelan.recovery.distributed-lease.enabled=true
gamelan.recovery.distributed-lease.name=workflow-recovery
gamelan.recovery.distributed-lease.owner-id=${GAMELAN_RECOVERY_LEASE_OWNER_ID:}
gamelan.recovery.distributed-lease.ttl=2m
gamelan.recovery.distributed-lease.renew-interval=0s
gamelan.agent.context.store=file
gamelan.agent.context.local.root=${GAMELAN_AGENT_CONTEXT_DIR:.gamelan/agent-context}
gamelan.agent.context.max-document-bytes=${GAMELAN_AGENT_CONTEXT_MAX_DOCUMENT_BYTES:8388608}
gamelan.agent.context.max-metadata-bytes=${GAMELAN_AGENT_CONTEXT_MAX_METADATA_BYTES:262144}
gamelan.agent.context.max-list-results=${GAMELAN_AGENT_CONTEXT_MAX_LIST_RESULTS:1000}
# Missing executor policy: fail | wait
gamelan.orchestrator.no-executor-policy=fail

# Executor Configuration
gamelan.executor.transport=LOCAL
gamelan.executor.auto-register=true
gamelan.registry.persistence.type=memory
gamelan.registry.selection.prefer-local=true
gamelan.grpc.task-stream.default-enabled=false
gamelan.grpc.task-stream.broker=memory
gamelan.grpc.task-stream.in-memory.ack-timeout=5m

# Security Configuration (disabled for standalone)
quarkus.security.enabled=false

# Health Checks
quarkus.smallrye-health.root-path=/health
quarkus.smallrye-health.ui.always-include=true

# Metrics
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics

# Swagger UI & OpenAPI
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Gamelan Standalone Workflow Engine API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=REST API for the Gamelan standalone workflow engine.

# REST Configuration
quarkus.rest.path=/

# JVM Options for standalone
quarkus.native.resources.includes=**/*.sql,**/*.properties

# Scheduler mode: local (in-memory) for standalone, redis for distributed
gamelan.scheduler.mode=local
