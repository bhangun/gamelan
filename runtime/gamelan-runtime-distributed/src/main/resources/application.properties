# Disable dev services to avoid Docker dependency
quarkus.datasource.devservices.enabled=false
quarkus.kafka.devservices.enabled=false
quarkus.redis.devservices.enabled=false

# PostgreSQL configuration for reactive client
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.reactive.url=postgresql://localhost:5432/gamelan

# Schema is owned by Flyway migrations, not Hibernate or runtime code.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration

# Disable SSL for internal services
quarkus.http.ssl.enabled=false

# Use a different port to avoid conflicts
quarkus.http.port=3100
quarkus.grpc.server.port=3101

# Enable alternative implementations
quarkus.arc.selected-alternatives=tech.kayys.gamelan.kafka.KafkaEventPublisher

# Indexing for bean discovery
quarkus.index-dependency.gamelan-engine.group-id=tech.kayys.gamelan
quarkus.index-dependency.gamelan-engine.artifact-id=gamelan-engine

quarkus.index-dependency.gamelan-grpc.group-id=tech.kayys.gamelan
quarkus.index-dependency.gamelan-grpc.artifact-id=gamelan-grpc

quarkus.index-dependency.gamelan-common.group-id=tech.kayys.gamelan
quarkus.index-dependency.gamelan-common.artifact-id=gamelan-common
quarkus.index-dependency.gamelan-plugin-spi.group-id=tech.kayys.gamelan
quarkus.index-dependency.gamelan-plugin-spi.artifact-id=gamelan-plugin-spi

# Logging
quarkus.log.level=INFO
quarkus.log.category."tech.kayys.gamelan".level=INFO

# Deployment mode: STANDALONE | SERVER | ENTERPRISE
gamelan.deployment-mode=ENTERPRISE
gamelan.multi-tenancy.enabled=true
gamelan.tenant.default-id=system
gamelan.runtime.capabilities.contract=distributed
gamelan.runtime.capabilities.cache-ttl=2s
gamelan.runtime.capabilities.startup-validation.mode=fail
gamelan.runtime.capabilities.startup-validation.accept-degraded=false
gamelan.runtime.capabilities.startup-validation.issue-detail-limit=10
gamelan.runtime.capabilities.readiness.accept-degraded=false
gamelan.runtime.capabilities.readiness.issue-detail-limit=10
gamelan.workflow.persistence.store=postgres
gamelan.event.publisher.family=kafka
gamelan.workflow.wakeup.outbox.store=postgres
gamelan.recovery.distributed-lease.enabled=true
gamelan.recovery.distributed-lease.name=workflow-recovery
gamelan.recovery.distributed-lease.owner-id=${GAMELAN_RECOVERY_LEASE_OWNER_ID:}
gamelan.recovery.distributed-lease.ttl=2m
gamelan.recovery.distributed-lease.renew-interval=0s
gamelan.agent.context.store=postgres
gamelan.agent.context.max-document-bytes=${GAMELAN_AGENT_CONTEXT_MAX_DOCUMENT_BYTES:8388608}
gamelan.agent.context.max-metadata-bytes=${GAMELAN_AGENT_CONTEXT_MAX_METADATA_BYTES:262144}
gamelan.agent.context.max-list-results=${GAMELAN_AGENT_CONTEXT_MAX_LIST_RESULTS:1000}
gamelan.registry.persistence.type=redis
gamelan.registry.selection.prefer-local=false
# Missing executor policy: fail | wait
gamelan.orchestrator.no-executor-policy=fail

# Scheduler mode: redis for distributed mode
gamelan.scheduler.mode=redis

# gRPC task streams are opt-in by executor metadata unless a profile enables
# stream-first delivery for every gRPC executor.
gamelan.grpc.task-stream.default-enabled=false
gamelan.grpc.task-stream.broker=redis
gamelan.grpc.task-stream.redis.block-timeout=1s
gamelan.grpc.task-stream.redis.reclaim-idle-timeout=5m
gamelan.grpc.task-stream.redis.reclaim-batch-size=100
gamelan.grpc.task-stream.redis.assignment-claim-ttl=30s
