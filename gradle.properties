# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true

gamelan.group=tech.kayys.gamelan
gamelan.version=0.1.0
gamelan.java.release=25
gamelan.quarkus.version=3.32.2

# Dependency repositories are Gradle-owned and configurable. Local Maven cache
# lookup is opt-in so normal builds do not silently depend on developer state.
gamelan.plugin.repositories.local.enabled=false
gamelan.repositories.local.enabled=false
gamelan.repositories.gollek.enabled=true
gamelan.repositories.gollek.url=https://maven.pkg.github.com/bhangun/gollek
gamelan.repositories.snapshots.enabled=true
gamelan.repositories.snapshots.url=https://oss.sonatype.org/content/repositories/snapshots
gamelan.repositories.jboss.enabled=true
gamelan.repositories.jboss.url=https://repository.jboss.org/nexus/content/groups/public
gamelan.dependencies.lz4.preferred-module=at.yawk.lz4:lz4-java:1.10.1

# Artifact publication is separated from compilation and tests.
gamelan.publish.enabled=false
