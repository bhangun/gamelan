# =============================================================================
# Workflow Gamelan Production Configuration
# =============================================================================
# This configuration file contains all production optimizations
# Copy to application.properties and adjust values as needed
# =============================================================================

# =============================================================================
# DATABASE CONFIGURATION - Optimized for JSONB operations
# =============================================================================

# Connection Pool
quarkus.datasource.jdbc.max-size=32
quarkus.datasource.jdbc.min-size=8
quarkus.datasource.jdbc.initial-size=8
quarkus.datasource.jdbc.acquisition-timeout=30S

# HikariCP Optimization
quarkus.datasource.jdbc.hikari.maximum-pool-size=32
quarkus.datasource.jdbc.hikari.minimum-idle=8
quarkus.datasource.jdbc.hikari.idle-timeout=300000
quarkus.datasource.jdbc.hikari.connection-timeout=30000
quarkus.datasource.jdbc.hikari.max-lifetime=1800000
quarkus.datasource.jdbc.hikari.leak-detection-threshold=60000

# PostgreSQL Specific
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.format-sql=false

# =============================================================================
# REDIS CONFIGURATION - Optimized for Streams and Locking
# =============================================================================

# Redis Connection
quarkus.redis.hosts=redis://localhost:6379
quarkus.redis.client-name=task-queue
quarkus.redis.max-pool-size=16
quarkus.redis.pool-cleaner-interval=1M
quarkus.redis.timeout=5S

# Redis Streams
gamelan.redis.stream.key=gamelan:task-queue
gamelan.redis.stream.group=gamelan-executors
gamelan.redis.stream.consumer-prefix=executor
gamelan.redis.stream.block-timeout=100
gamelan.redis.stream.batch-size=10

# Redis Locking
gamelan.redis.lock.prefix=gamelan:lock:
gamelan.redis.lock.timeout=10000
gamelan.redis.lock.retries=3
gamelan.redis.lock.retry-delay=100

# =============================================================================
# KAFKA CONFIGURATION - Optimized for High Throughput
# =============================================================================

# Producer Configuration
mp.messaging.outgoing.workflow-events.connector=smallrye-kafka
mp.messaging.outgoing.workflow-events.topic=workflow-events
mp.messaging.outgoing.workflow-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.workflow-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer

# Batching Optimization
mp.messaging.outgoing.workflow-events.batch.size=65536
mp.messaging.outgoing.workflow-events.linger.ms=20
mp.messaging.outgoing.workflow-events.acks=all
mp.messaging.outgoing.workflow-events.retries=3
mp.messaging.outgoing.workflow-events.compression.type=lz4

# Consumer Configuration
mp.messaging.incoming.workflow-results.connector=smallrye-kafka
mp.messaging.incoming.workflow-results.topic=workflow-results
mp.messaging.incoming.workflow-results.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.workflow-results.auto.offset.reset=earliest
mp.messaging.incoming.workflow-results.max.poll.records=100

# =============================================================================
# MUTINY & REACTIVE CONFIGURATION - Optimized for Concurrency
# =============================================================================

# Max Concurrent Executions
gamelan.engine.max-concurrent-executions=5000
gamelan.engine.max-concurrent-workflows=1000
gamelan.engine.max-concurrent-nodes=10000

# Backpressure Configuration
gamelan.engine.backpressure.buffer-size=1024
gamelan.engine.backpressure.request-limit=100
gamelan.engine.backpressure.strategy=drop

# Context Propagation
smallrye.context-propagation.enabled=true
smallrye.context-propagation.thread-pool-size=16
smallrye.context-propagation.max-queue-size=1024

# =============================================================================
# GRPC & PROTOBUF CONFIGURATION - Optimized for Performance
# =============================================================================

# gRPC Client
quarkus.grpc.clients.workflow.host=localhost
quarkus.grpc.clients.workflow.port=9000
quarkus.grpc.clients.workflow.use-offload=true
quarkus.grpc.clients.workflow.offload-threads=8
quarkus.grpc.clients.workflow.protobuf.use-blocking-stub=false

# gRPC Server
quarkus.grpc.server.port=9000
quarkus.grpc.server.max-inbound-message-size=16777216
quarkus.grpc.server.max-inbound-metadata-size=16384

# =============================================================================
# NETTY CONFIGURATION - Optimized for Native Transport
# =============================================================================

# Native Transport
quarkus.netty.transport.epoll=true
quarkus.netty.transport.epoll.native-lib-dir=/opt/netty-native
quarkus.netty.transport.kqueue=false

# Event Loop
quarkus.netty.event-loops.thread-count=16
quarkus.netty.event-loops.prefer-native=true

# Connection Pool
quarkus.netty.connection-pool.max-size=64
quarkus.netty.connection-pool.idle-timeout=60S

# =============================================================================
# GC & JVM CONFIGURATION - Optimized for Reactive Workloads
# =============================================================================

# G1GC Tuning (Default)
quarkus.jvm.additional-args=-XX:+UseG1GC
quarkus.jvm.additional-args=-XX:MaxGCPauseMillis=100
quarkus.jvm.additional-args=-XX:G1HeapRegionSize=16m
quarkus.jvm.additional-args=-XX:InitiatingHeapOccupancyPercent=45
quarkus.jvm.additional-args=-XX:G1ReservePercent=10
quarkus.jvm.additional-args=-XX:G1NewSizePercent=30
quarkus.jvm.additional-args=-XX:G1MaxNewSizePercent=40

# Shenandoah GC (Alternative for Low Latency)
# quarkus.jvm.additional-args=-XX:+UseShenandoahGC
# quarkus.jvm.additional-args=-XX:ShenandoahGCHeuristics=compact
# quarkus.jvm.additional-args=-XX:ShenandoahGCMode=iu
# quarkus.jvm.additional-args=-XX:ShenandoahUncommitDelay=300000

# Heap Configuration
quarkus.jvm.additional-args=-Xms2g
quarkus.jvm.additional-args=-Xmx8g
quarkus.jvm.additional-args=-XX:MaxMetaspaceSize=512m

# =============================================================================
# NATIVE IMAGE CONFIGURATION - Optimized for Production
# =============================================================================

# Native Build
quarkus.native.enabled=true
quarkus.native.container-build=true
quarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21

# Advanced Native Options
quarkus.native.additional-build-args=\
    -H:+StaticExecutableWithDynamicLibC,\
    -H:IncludeResourceBundles=com.sun.org.apache.xerces.internal.impl.msg.XMLMessages,\
    --initialize-at-run-time=org.hibernate.validator,\
    --report-unsupported-elements-at-runtime,\
    -O3

# Native Memory
quarkus.native.native-image-xmx=4g
quarkus.native.enable-vm-inspection=true

# =============================================================================
# MONITORING & OBSERVABILITY
# =============================================================================

# Metrics
quarkus.metrics.enabled=true
quarkus.metrics.path=/metrics
quarkus.metrics.scrape-interval=15s

# Health Checks
quarkus.smallrye-health.enabled=true
quarkus.smallrye-health.path=/health
quarkus.smallrye-health.readiness.path=/health/ready
quarkus.smallrye-health.liveness.path=/health/live

# Tracing
quarkus.opentelemetry.enabled=true
quarkus.opentelemetry.tracer.exporter.otlp.enabled=true
quarkus.opentelemetry.tracer.exporter.otlp.endpoint=http://jaeger:4317

# Logging
quarkus.log.level=INFO
quarkus.log.category."tech.kayys.gamelan".level=DEBUG
quarkus.log.console.format=%d{YYYY-MM-dd HH:mm:ss} %-5p [%c{1.}] (%t) %s%e%n
quarkus.log.file.enable=true
quarkus.log.file.path=/var/log/gamelan/application.log
quarkus.log.file.rotation.max-file-size=100M
quarkus.log.file.rotation.max-backup-index=10

# =============================================================================
# SAGA PATTERN CONFIGURATION
# =============================================================================

# Compensation
gamelan.saga.compensation.timeout=30000
gamelan.saga.compensation.max-retries=3
gamelan.saga.compensation.parallel=true
gamelan.saga.compensation.idempotency-enabled=true

# Idempotency
gamelan.saga.idempotency.ttl=3600
gamelan.saga.idempotency.cache-size=10000

# =============================================================================
# WORKFLOW EXECUTION CONFIGURATION
# =============================================================================

# Execution
gamelan.workflow.execution.timeout=300000
gamelan.workflow.execution.max-nodes=1000
gamelan.workflow.execution.retry-enabled=true
gamelan.workflow.execution.max-retries=3

# Snapshots
gamelan.workflow.snapshot.enabled=true
gamelan.workflow.snapshot.frequency=50
gamelan.workflow.snapshot.ttl=604800

# Events
gamelan.workflow.event.append-async=true
gamelan.workflow.event.batch-size=100
gamelan.workflow.event.ttl=2592000

# =============================================================================
# SECURITY CONFIGURATION
# =============================================================================

# Authentication
quarkus.http.auth.basic.enabled=false
quarkus.oidc.enabled=true
quarkus.oidc.auth-server-url=http://keycloak:8080/realms/gamelan
quarkus.oidc.client-id=gamelan-engine
quarkus.oidc.credentials.secret=change-me

# Authorization
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# =============================================================================
# PRODUCTION PROFILES
# =============================================================================

# Development Profile
%dev.quarkus.profile=dev
%dev.quarkus.log.level=DEBUG
%dev.quarkus.datasource.jdbc.max-size=16
%dev.quarkus.native.enabled=false

# Staging Profile
%staging.quarkus.profile=staging
%staging.quarkus.log.level=INFO
%staging.quarkus.datasource.jdbc.max-size=24
%staging.quarkus.native.enabled=true

# Production Profile
%prod.quarkus.profile=prod
%prod.quarkus.log.level=WARN
%prod.quarkus.datasource.jdbc.max-size=32
%prod.quarkus.native.enabled=true
%prod.quarkus.kubernetes-config.enabled=true
%prod.quarkus.kubernetes-config.config-maps=gamelan-config

# =============================================================================
# KUBERNETES INTEGRATION
# =============================================================================

# Kubernetes Config
quarkus.kubernetes-config.enabled=true
quarkus.kubernetes-config.config-maps=gamelan-config
quarkus.kubernetes-config.secrets.enabled=true
quarkus.kubernetes-config.secrets=gamelan-secrets

# Kubernetes Health
quarkus.kubernetes.liveness-probe.initial-delay=30S
quarkus.kubernetes.liveness-probe.period=10S
quarkus.kubernetes.liveness-probe.timeout=5S
quarkus.kubernetes.liveness-probe.failure-threshold=3

quarkus.kubernetes.readiness-probe.initial-delay=10S
quarkus.kubernetes.readiness-probe.period=5S
quarkus.kubernetes.readiness-probe.timeout=3S
quarkus.kubernetes.readiness-probe.failure-threshold=3

# =============================================================================
# END OF PRODUCTION CONFIGURATION
# =============================================================================
